name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pygame needs a video driver even with no display attached.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pygame>=2.6,<3" ruff mypy pytest

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

      # The automata engine has to stay usable without a display. This guard
      # is the architectural boundary, enforced mechanically rather than by
      # discipline. It currently protects core/; when the engine is extracted
      # into src/fsa/ the path below moves with it.
      - name: Engine must not depend on pygame
        run: |
          if grep -rn "pygame" core/; then
            echo "::error::pygame referenced inside core/ -- the engine must stay display-free"
            exit 1
          fi
          echo "core/ is pygame-free"
