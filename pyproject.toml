[project]
name = "finite-automata-simulator"
version = "0.1.0.dev0"
description = "A visual editor and step-through simulator for deterministic finite automata"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Kaleem Durrani" }]
keywords = ["automata", "dfa", "finite-state-machine", "theory-of-computation", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Visualization",
]

# The automata engine is intended to stay dependency-free. Pygame is only
# needed by the GUI front-end, so it lives in an extra rather than here.
dependencies = []

[project.optional-dependencies]
gui = ["pygame>=2.6,<3"]
dev = ["ruff>=0.16", "mypy>=1.11", "pytest>=8.0"]

[project.scripts]
fsa = "fsa.cli:run_main"

[project.urls]
Repository = "https://github.com/kaleem-Durrani/Finite-Automata-Simulator"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsa"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes: undefined names, unused imports, unused locals
    "E",   # pycodestyle errors
    "I",   # import ordering
    "ARG", # unused arguments
]

[tool.ruff.lint.isort]
known-first-party = ["fsa", "editor", "rendering", "ui"]

[tool.mypy]
python_version = "3.12"
files = ["src", "rendering", "ui", "main.py", "editor.py", "tests"]
mypy_path = "src"
# The existing GUI code is not annotated well enough for strict mode yet.
# Strictness is raised package by package as each is rewritten.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The engine is new code with no legacy to accommodate, so it is held to a
# higher standard than the GUI. `strict` itself is not a per-module option --
# setting it here applies it to the whole project -- so the checks are listed
# individually, and CI additionally runs `mypy --strict src/fsa`.
[[tool.mypy.overrides]]
module = "fsa.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
warn_return_any = true
no_implicit_reexport = false  # __init__ deliberately re-exports the public API
strict_equality = true

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Pygame needs a video driver even headlessly; tests/conftest.py sets
# SDL_VIDEODRIVER=dummy before pygame is imported.
