name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pygame needs a video driver even with no display attached.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pygame>=2.6,<3" ruff mypy pytest pytest-cov

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Type check the engine strictly
        run: mypy --strict src/fsa

      - name: Test
        run: pytest

      - name: Engine coverage
        run: pytest tests/test_engine.py tests/test_conformance.py --cov=fsa --cov-branch --cov-fail-under=90

      - name: Documented examples must run
        run: cd src && python -m doctest fsa/__init__.py

      # The engine and its CLI have to be usable on a machine with no graphics
      # stack at all -- that is the point of keeping them dependency-free.
      - name: Install without pygame and drive the CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet .
          /tmp/clean/bin/python -c "import importlib.util, sys;             sys.exit(0 if importlib.util.find_spec('pygame') is None else 1)"
          /tmp/clean/bin/fsa --version
          /tmp/clean/bin/fsa show examples/simple_binary.json
          /tmp/clean/bin/fsa test examples/simple_binary.json 011
          if /tmp/clean/bin/fsa test examples/simple_binary.json 101; then
            echo "::error::a rejected word must exit non-zero"; exit 1
          fi
          /tmp/clean/bin/fsa export examples/simple_binary.json -f svg > /dev/null

      - name: Exports must parse
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          cd src && python -m fsa export ../examples/simple_binary.json -f dot             | dot -Tsvg > /dev/null
          python -m fsa export ../examples/simple_binary.json -f svg             | python -c "import sys, xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read())"

      # The engine has to stay usable without a display, and dependency-free.
      # This is the architectural boundary stated as a build failure rather
      # than as a convention.
      #
      # Parses the import statements rather than grepping for the word: the
      # engine's own docstrings explain the rule, and a plain grep flagged
      # those as violations.
      - name: Engine must not depend on pygame
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          # The oracle libraries are test tools. If one ever reached the
          # engine, our algorithms would be checked against themselves
          # wearing a different hat, and the differential suite would be
          # asserting nothing at all.
          banned = {"pygame", "networkx", "numpy", "automata", "frozendict",
                    "hypothesis", "greenery", "pydot", "graphviz"}
          bad = []
          for path in pathlib.Path("src/fsa").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      if name.split(".")[0] in banned:
                          bad.append(f"{path}:{node.lineno} imports {name}")
          if bad:
              print("::error::the engine must stay display-free and dependency-free")
              print("\n".join(bad))
              sys.exit(1)
          print("engine imports nothing outside the standard library")
          PY

      - name: Engine must import with no third-party packages available
        run: |
          cd src && python -c "
          import sys
          for blocked in ('pygame', 'networkx', 'numpy', 'hypothesis', 'automata'):
              sys.modules[blocked] = None
          import fsa
          print(f'fsa imports clean, {len(fsa.__all__)} public names')
          "
